# Xena Portal - refresh the data snapshot every 30 min WITHOUT a Vercel rebuild.
# Replaces the old cron-job.org -> "Cache" deploy hook cycle (each ping forced a
# full ~216 MB redeploy and filled Functions Storage). This runner fetches the
# same Feishu tables and commits the snapshot into a PRIVATE GitHub data repo
# (Phase 53); index4.py serves whichever snapshot (GitHub vs Redis vs disk) is
# fresher. (Phase 52 pushed to Upstash Redis instead - moved off it because the
# free tier's 10 GB/month bandwidth could not carry ~9.6 GB/month of writes.)
#
# SETUP (one time):
#   1. Put this file at  .github/workflows/refresh-data.yml  in the PUBLIC
#      portal repo (public repo = free unlimited Actions minutes).
#   2. Put refresh_snapshot.py in the SAME folder as fetch_data.py.
#   3. Create a PRIVATE repo (e.g. "xena-data") - no README needed.
#   4. Create a fine-grained PAT scoped to that repo ONLY, Contents:
#      Read and Write (note: fine-grained PATs expire after max 1 year -
#      when it expires the refresh stops and the portal silently serves the
#      last snapshot, so calendar the renewal).
#   5. Repo -> Settings -> Secrets and variables -> Actions -> add secrets:
#        LARK_APP_ID, LARK_APP_SECRET        (same values as Vercel env)
#        DATA_REPO_TOKEN                     (the PAT from step 4)
#      and set DATA_REPO below ("your-username/xena-data" - not secret).
#   6. Actions tab -> "Refresh Xena data snapshot" -> Run workflow (manual test).
#   7. Once one run is green: delete the cron-job.org job and the Vercel
#      "Cache" deploy hook (Settings -> Git -> Deploy Hooks), and the
#      UPSTASH_* secrets here can go too (Redis now serves comments only).
#
# Notes:
#   - Scheduled runs can lag a few minutes at GitHub peak times - the snapshot
#     is still fresher than the old multi-minute build+deploy gap, and never
#     leaves a half-built site.
#   - GitHub auto-disables schedules after 60 days of repo inactivity; any
#     push re-enables them (this workflow's own commits to the data repo do
#     NOT count - activity must be on THIS repo).
name: Refresh Xena data snapshot (GitHub repo)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:       # allows a manual "Run workflow" button
    inputs:
      force_full:
        description: "Force a FULL refresh of every table (skips the fast incremental path)"
        type: boolean
        default: false

permissions:
  contents: none          # read-only checkout; pushes to the data repo use the PAT

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Fetch Feishu tables and push snapshot to the data repo
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ahmedmohamedmahmoudabdelaziz-blip/xena-data
          FORCE_FULL: ${{ inputs.force_full == true }}
        run: |
          set -e
          SCRIPT_DIR=$(dirname "$(find . -maxdepth 4 -name fetch_data.py | head -1)")
          echo "Using script directory: $SCRIPT_DIR"
          test -f "$SCRIPT_DIR/refresh_snapshot.py"
          python "$SCRIPT_DIR/refresh_snapshot.py"
